experiment:
  name: etth1_ot_qwen3_1_7b_sft_4gpu
  stage: sft
  seed: 42

data:
  reader:
    name: csv
    path: ./castfactory/dataset/ETTh1/ETTh1.csv
    timestamp_col: date
    target_channels: [OT]
  split:
    type: ratio
    ratios: [0.7, 0.1, 0.2]
  window:
    context_length: 96
    prediction_length: 96
    stride: 96

representation:
  name: markdown_table
  significant_digits: 2

model:
  backbone:
    name: hf_causal_lm
    model_name: /home/zyt/LLM/Qwen3-1.7B
    trust_remote_code: true

training:
  init_checkpoint: ./checkpoints/etth1_qwen3_1_7b_4gpu/etth1_ot_qwen_cpt
  checkpoint_dir: ./checkpoints/etth1_qwen3_1_7b_4gpu/etth1_ot_qwen_sft
  backend:
    name: fsdp
    max_prompt_length: 2048
    max_response_length: 1024
    max_seq_length: 3072
    bf16: true
    gradient_checkpointing: true
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 8
    fsdp: "full_shard auto_wrap"
    fsdp_config:
      state_dict_type: FULL_STATE_DICT
      transformer_layer_cls_to_wrap: Qwen3DecoderLayer
  args:
    num_train_epochs: 1
    learning_rate: 2.0e-4

trace:
  run_root: ./runs/etth1_qwen3_1_7b_4gpu
